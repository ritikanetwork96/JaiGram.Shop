<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0718"/>
      <stop offset="100%" stop-color="#050209"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85"/>
      <stop offset="45%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="neonAura" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#ff2a85" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#050209" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Ambient Neon Rim -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="url(#neonBorder)" stroke-width="4" stroke-opacity="0.55"/>
  <!-- Radial Neon Aura Bloom -->
  <rect width="512" height="512" rx="112" fill="url(#neonAura)"/>

  <!-- Shopping Bag Handles -->
  <path d="M 204 186 C 204 126, 308 126, 308 186" fill="none" stroke="url(#neonPink)" stroke-width="24" stroke-linecap="round" filter="url(#neonFilter)"/>

  <!-- Glowing Shopping Bag Body -->
  <path d="M 158 198 L 354 198 L 374 384 C 376 402, 362 416, 344 416 L 168 416 C 150 416, 136 402, 138 384 Z" 
        fill="#120924" fill-opacity="0.8" stroke="url(#neonPink)" stroke-width="24" stroke-linejoin="round" stroke-linecap="round" filter="url(#neonFilter)"/>

  <!-- Bag Perspective Side Depth Lines -->
  <path d="M 158 198 L 180 414 M 354 198 L 332 414" fill="none" stroke="url(#neonPink)" stroke-width="6" stroke-opacity="0.4"/>

  <!-- Stylized G Monogram for JaiGram -->
  <path d="M 288 280 C 288 258, 272 244, 256 244 C 228 244, 212 268, 212 308 C 212 348, 228 372, 256 372 C 278 372, 292 356, 294 332 L 254 332" 
        fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonFilter)"/>
</svg>
