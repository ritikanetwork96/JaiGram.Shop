<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#140726"/>
      <stop offset="60%" stop-color="#090312"/>
      <stop offset="100%" stop-color="#040108"/>
    </radialGradient>

    <!-- Neon Rim Gradient -->
    <linearGradient id="neonRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Bag Glow Gradient -->
    <linearGradient id="neonBag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85"/>
      <stop offset="40%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Center Ambient Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="52%" r="40%">
      <stop offset="0%" stop-color="#ff2a85" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#040108" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="neonBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Ambient Glow -->
  <rect width="512" height="512" rx="116" fill="url(#centerGlow)"/>

  <!-- Sleek Neon Rim -->
  <rect x="8" y="8" width="496" height="496" rx="110" fill="none" stroke="url(#neonRim)" stroke-width="4" stroke-opacity="0.65"/>
  <rect x="14" y="14" width="484" height="484" rx="104" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Shopping Bag Emblem (Clean Modern Vector) -->
  <g filter="url(#neonBloom)">
    <!-- Bag Handle -->
    <path d="M 204 186 C 204 120, 308 120, 308 186" 
          fill="none" stroke="url(#neonBag)" stroke-width="22" stroke-linecap="round"/>

    <!-- Bag Main Body -->
    <path d="M 154 196 L 358 196 L 378 392 C 380 410, 366 424, 348 424 L 164 424 C 146 424, 132 410, 134 392 Z" 
          fill="#130826" fill-opacity="0.85" stroke="url(#neonBag)" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 3D Perspective Depth Lines -->
    <path d="M 154 196 L 176 422 M 358 196 L 336 422" 
          fill="none" stroke="url(#neonBag)" stroke-width="5" stroke-opacity="0.35"/>

    <!-- Modern Signature 'G' Center Mark -->
    <path d="M 292 284 C 292 260, 274 246, 256 246 C 224 246, 206 272, 206 312 C 206 352, 224 378, 256 378 C 280 378, 296 360, 298 334 L 254 334" 
          fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
