<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    (function() {
      if (window.location.protocol === 'file:') return;
      var isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      if (isLocal) return;
      var path = window.location.pathname;
      var cleanPath = null;
      if (path.endsWith('/index.html')) {
        cleanPath = path.substring(0, path.length - 10) || '/';
      } else if (path.endsWith('.html')) {
        cleanPath = path.substring(0, path.length - 5);
      }
      if (cleanPath !== null) {
        window.history.replaceState(null, '', cleanPath + window.location.search + window.location.hash);
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JaiGram Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/admin/assets/admin.css?v=50" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body data-theme="dark">
  <div class="admin-shell" id="adminShell">
    <aside class="sidebar glass" id="sidebar">
      <button class="sidebar-close" id="sidebarCloseBtn" type="button" aria-label="Close navigation menu">
        <i data-lucide="x"></i>
      </button>
      <div class="brand">
        <div class="brand-mark">J</div>
        <div>
          <div class="brand-title">JaiGram Admin</div>
          <div class="brand-subtitle">Production control center</div>
        </div>
      </div>
      <div class="nav-section-label">Navigation</div>
      <nav class="nav-group" id="sideNav"></nav>
      <div class="sidebar-footer">
        <button class="btn btn-ghost btn-block" id="sidebarThemeBtn" type="button"><i data-lucide="moon-star"></i> Theme</button>
        <button class="btn btn-danger btn-block" id="sidebarLogoutBtn" type="button"><i data-lucide="log-out"></i> Logout</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar glass">
        <div class="topbar-left">
          <button class="btn btn-ghost admin-mobile-toggle" id="mobileMenuBtn" type="button" aria-label="Open navigation menu">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" x2="21" y1="12" y2="12"></line><line x1="3" x2="21" y1="6" y2="6"></line><line x1="3" x2="21" y1="18" y2="18"></line></svg>
          </button>
          <div class="searchbox">
            <i data-lucide="search"></i>
            <input id="commandInput" type="search" placeholder="Search... (Ctrl+K)" />
          </div>
        </div>
        <div class="topbar-right">
          <div class="realtime-badge active" id="connectionStatus" title="Realtime Firebase DB connected">
            <span class="pulse"></span> Connected
          </div>
          <button class="btn btn-ghost icon-only" id="quickPaletteBtn" type="button" title="Quick Search (Ctrl+K)">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
          </button>
          <button class="btn btn-ghost icon-only" id="notifyBtn" type="button" title="Recent Activity" style="position: relative;">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
            <span class="badge badge-primary" id="notifyCount" style="position: absolute; top: -4px; right: -4px; font-size: 10px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 9999px; display: inline-flex; align-items: center; justify-content: center;">0</span>
          </button>
          <div class="admin-profile" id="adminProfile">
            <div class="avatar" id="userAvatar">A</div>
            <div>
              <span id="userName">Admin</span>
              <span id="userEmail">connected</span>
            </div>
          </div>
          <button class="btn btn-danger" id="logoutBtn" type="button"><i data-lucide="log-out"></i> Logout</button>
        </div>
      </header>

      <div class="view-root" id="viewRoot">
        <div class="view-loading-shell" style="min-height: 520px;">
          <div class="view-loading-card glass">
            <div class="view-loading-spinner"></div>
            <div class="view-loading-title">JaiGram Admin</div>
            <div class="view-loading-sub">Connecting to live store...</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

  <nav class="mobile-app-dock glass" id="mobileAppDock" aria-label="Mobile Navigation">
    <a class="dock-item active" href="#/dashboard" data-route-match="dashboard" title="Dashboard">
      <i data-lucide="layout-dashboard"></i>
      <span>Home</span>
    </a>
    <a class="dock-item" href="#/catalog" data-route-match="catalog" title="Catalog">
      <i data-lucide="package"></i>
      <span>Catalog</span>
    </a>
    <a class="dock-item" href="#/orders" data-route-match="orders" title="Orders">
      <i data-lucide="receipt"></i>
      <span>Orders</span>
    </a>
    <a class="dock-item" href="#/analytics" data-route-match="analytics" title="Analytics">
      <i data-lucide="trending-up"></i>
      <span>Analytics</span>
    </a>
    <button class="dock-item" type="button" id="dockMenuToggleBtn" onclick="document.getElementById('mobileMenuBtn')?.click()" title="Menu">
      <i data-lucide="menu"></i>
      <span>Menu</span>
    </button>
  </nav>

  <script>
    (function() {
      function syncDock() {
        var h = (window.location.hash || '#/dashboard').replace(/^#\/?/, '').split('/')[0] || 'dashboard';
        if (h === 'products' || h === 'categories') h = 'catalog';
        document.querySelectorAll('.dock-item[data-route-match]').forEach(function(el) {
          if (el.getAttribute('data-route-match') === h) {
            el.classList.add('active');
          } else {
            el.classList.remove('active');
          }
        });
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
          window.lucide.createIcons();
        }
      }
      window.addEventListener('hashchange', syncDock);
      window.addEventListener('DOMContentLoaded', syncDock);
      setTimeout(syncDock, 50);
      setTimeout(syncDock, 200);
      setTimeout(syncDock, 800);
    })();
  </script>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal glass" id="modalRoot"></div>
  </div>

  <div class="toast-host" id="toastHost"></div>

  <div class="modal-backdrop" id="paletteBackdrop">
    <div class="modal palette glass">
      <div class="panel-head">
        <div>
          <h2 class="section-title">Command Search</h2>
          <p class="section-subtitle">Jump to any admin section or action.</p>
        </div>
        <button class="btn btn-ghost" data-close-palette type="button"><i data-lucide="x"></i></button>
      </div>
      <div class="palette-list" id="paletteList"></div>
    </div>
  </div>

  <script type="module" src="/admin/js/app.js?v=102"></script>
</body>
</html>
