# Cloudflare Configuration (wrangler.toml)
name = "jaigram-shop"
main = "worker.js"
compatibility_date = "2024-09-28"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

[observability]
enabled = false

[build]
command = "node scripts/sync-env.mjs"
