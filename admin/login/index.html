<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - JaiGram Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/assets/admin.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body data-theme="dark">
  <main id="authMount"></main>
  <script type="module">
    import { mountLoginPage, whenAuthenticated } from '/admin/js/auth.js';
    const mount = document.getElementById('authMount');
    whenAuthenticated((user) => {
      if (user) {
        window.location.href = '/admin/';
      }
    });
    mountLoginPage(mount);
    if (window.lucide) lucide.createIcons();
  </script>
</body>
</html>
